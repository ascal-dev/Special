<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Shaka Player</title>
    <!-- Shaka Player UI Assets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.min.css">
    
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        #video-container { max-width: 800px; margin: 0 auto; background: black; position: relative; }
        video { width: 100%; aspect-ratio: 16/9; }
        
        .controls-row { max-width: 800px; margin: 20px auto; display: flex; gap: 10px; }
        input, select { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #1e1e1e; color: white; flex: 1; }
        
        #channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; max-width: 1000px; margin: 20px auto; }
        .card { background: #1e1e1e; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .card:hover { border-color: #e8534a; background: #252525; }
        .card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }
        .card p { margin: 5px 0; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #e8534a; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; }
        #toast.show { display: block; }
    </style>
</head>
<body>

    <div id="video-container" data-shaka-player-container>
        <video id="video" autoplay></video>
    </div>

    <div class="controls-row">
        <input type="text" id="search" placeholder="Search channels..." oninput="filterChannels()">
        <select id="category" onchange="filterChannels()">
            <option value="all">All Categories</option>
        </select>
    </div>

    <div id="channel-grid"></div>
    <div id="toast"></div>

<script>
// ===== GLOBAL STATE =====
let shakaPlayer = null;
let allChannels = [];
let streamConfig = {}; // Dynamically updated

// ===== LOAD DATA FROM JSON =====
async function loadData() {
    try {
        const res = await fetch('https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/tplyfaster.json');
        const data = await res.json();
        
        // Filter: DRM not empty AND Token not empty
        allChannels = data.filter(ch => {
            const hasDrm = ch.drm && Object.keys(ch.drm).length > 0;
            const hasToken = ch.token && ch.token.length > 10;
            return hasDrm && hasToken;
        });

        populateCategories();
        renderChannels(allChannels);
    } catch (e) {
        showToast("Failed to load channel data");
    }
}

function populateCategories() {
    const cats = [...new Set(allChannels.map(ch => ch.category))];
    const select = document.getElementById('category');
    cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        select.appendChild(opt);
    });
}

function renderChannels(list) {
    const grid = document.getElementById('channel-grid');
    grid.innerHTML = list.map(ch => `
        <div class="card" onclick="selectChannel('${ch.id}')">
            <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/60'">
            <p>${ch.name}</p>
            <small style="color:#888">${ch.category}</small>
        </div>
    `).join('');
}

function filterChannels() {
    const query = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('category').value;
    const filtered = allChannels.filter(ch => {
        const matchesName = ch.name.toLowerCase().includes(query);
        const matchesCat = cat === 'all' || ch.category === cat;
        return matchesName && matchesCat;
    });
    renderChannels(filtered);
}

function selectChannel(id) {
    const channel = allChannels.find(c => c.id === id);
    if (!channel) return;

    // Map JSON to your existing streamConfig structure
    streamConfig = {
        name: channel.name,
        mpd: channel.mpd,
        // Extract the hdnea part from the token URL
        token: channel.token, 
        referer: channel.referer,
        userAgent: channel.userAgent,
        drm: channel.drm
    };

    showToast(`Loading: ${streamConfig.name}`);
    configureShakaPlayer(streamConfig.mpd);
}

// ===== YOUR ORIGINAL SHAKA LOGIC (UNCHANGED) =====
document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) {
        alert('Browser not supported');
        return;
    }

    const video = document.getElementById('video');
    const videoContainer = document.querySelector('[data-shaka-player-container]');
    shakaPlayer = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(shakaPlayer, videoContainer, video);

    ui.configure({
        controlPanelElements: ['play_pause', 'time_and_duration', 'spacer', 'language', 'mute', 'fullscreen', 'quality', 'overflow_menu'],
        overflowMenuButtons: ['captions', 'playback_rate'],
    });

    loadData(); // Start the loading process
});

function configureShakaPlayer(mpdUrl) {
    shakaPlayer.configure({
        drm: { clearKeys: streamConfig.drm },
        streaming: {
            bufferingGoal: 30,
            rebufferingGoal: 15,
            retryParameters: { maxAttempts: 5 }
        }
    });

    shakaPlayer.getNetworkingEngine().clearAllRequestFilters();
    shakaPlayer.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = streamConfig.referer;
        request.headers['User-Agent'] = streamConfig.userAgent;
        if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            !request.uris[0].includes('__hdnea')) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + streamConfig.token;
        }
    });

    shakaPlayer.load(mpdUrl).then(() => {
        console.log('Stream loaded:', mpdUrl);
    }).catch(e => {
        console.error('Load error', e);
        showToast("Error loading channel");
    });
}

// ===== TOAST UTILITY =====
let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
</body>
</html>
